# =============================================================================
# Voice Satellite V3 (custom PCB, rev A) - ESPHome example config - DRAFT, NEVER FLASHED
#
# The V3 board has not been fabricated, so this file has never run on hardware. It is the V2 config
# with the V3 pin map, 18 on-board LEDs, USB-C CC sensing and logging over the native USB port.
#   Mic (ICS-43434 / INMP441 module on the carrier, J2): SCK GPIO11, WS GPIO12, SD GPIO13, L/R tied to GND -> left
#   Amp MAX98357A (on board):                            BCLK GPIO47, LRC GPIO48, DIN GPIO21, SD GPIO7 (10 kOhm pull-down)
#   LEDs 18x WS2812B on the board edge via 74AHCT1G125:  data GPIO14 (10 kOhm pull-down), chain clockwise from back-left
#   USB-C CC sense (5.1 kOhm Rd + 10 kOhm series):       CC1 GPIO4, CC2 GPIO5
#   Buttons: SW1 RESET (EN), SW2 BOOT (IO0). Logs + first flash over the USB-C port (native USB-Serial-JTAG).
# =============================================================================
substitutions:
  name: "voice-satellite-v3"
  friendly_name: "Voice Satellite V3"

  # --- LED look: warm amber. WS2812 green is very strong, so green is kept low to get orange instead of yellow.
  amber_r: "100%"
  amber_g: "37%"
  amber_b: "6%"

  # --- Stage timeouts (seconds): the LEDs always fall back to idle after these.
  listen_timeout_s: "15"     # wake word -> end of speech
  think_timeout_s: "45"      # end of speech -> first answer (a future LLM step may be slower)
  respond_timeout_s: "120"   # answer playing (long answers)
  pipeline_timeout_s: "180"  # hard limit for one whole voice interaction

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - switch.turn_off: amp_enable
      - script.execute: led_idle

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# CRITICAL: required for micro_wake_word (ESP32-S3-WROOM-1-N16R8: 8 MB octal PSRAM)
psram:
  mode: octal
  speed: 80MHz

logger:
  baud_rate: 115200
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG      # logs over the USB-C port (no UART header on the board)

api:
  encryption:
    key: !secret api_encryption_key       # 32-byte base64 key, generate one per device
  on_client_connected:
    - delay: 100ms
    - micro_wake_word.start:
    - script.execute: led_idle
  on_client_disconnected:
    - micro_wake_word.stop:
    - voice_assistant.stop:
    - script.execute: led_disconnected

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none     # keeps audio streaming smooth

# ---------------------------------------------------------------------------
# Audio
# ---------------------------------------------------------------------------
# I2S Bus 0 (Microphone)
i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO12
    i2s_bclk_pin: GPIO11

  # I2S Bus 1 (Speaker)
  - id: i2s_out
    i2s_lrclk_pin: GPIO48
    i2s_bclk_pin: GPIO47

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_in
    adc_type: external
    i2s_din_pin: GPIO13
    pdm: false
    channel: left

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO21
    buffer_duration: 800ms
    timeout: 1s          # keep the I2S clock running a bit after playback: the amp is switched off first

media_player:
  - platform: speaker
    id: mp
    name: "${friendly_name} Speaker"
    task_stack_in_psram: true
    buffer_size: 2000000
    announcement_pipeline:
      speaker: spk
    # Amplifier power gating: on as soon as anything plays, off shortly after it goes idle.
    on_announcement:
      - script.stop: amp_off_later
      - switch.turn_on: amp_enable
    on_play:
      - script.stop: amp_off_later
      - switch.turn_on: amp_enable
    on_idle:
      - script.execute: amp_off_later
      - if:
          condition:
            lambda: 'return id(led_phase) == 3;'
          then:
            - script.execute: led_idle

# MAX98357A SD (shutdown) pin: LOW = amp off (no hiss, no crackle), HIGH (3.3 V) = amp on, left channel.
# R7 (10 kOhm pull-down on the board) keeps the amp off while the ESP32 boots.
switch:
  - platform: gpio
    id: amp_enable
    name: "${friendly_name} Amplifier"
    pin: GPIO7
    restore_mode: ALWAYS_OFF
    internal: true

micro_wake_word:
  id: mww
  models:
    - model: hey_jarvis
  on_wake_word_detected:
    - logger.log: "Wake word detected"
    - script.execute: led_listening
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic
  media_player: mp          # the media player owns all audio -> one place to gate the amp
  use_wake_word: false
  on_listening:
    - script.execute: led_listening
  on_stt_vad_end:            # user stopped talking -> loading circle
    - script.execute: led_thinking
  on_stt_end:                # fallback if VAD end was not reported
    - if:
        condition:
          lambda: 'return id(led_phase) == 1;'
        then:
          - script.execute: led_thinking
  on_tts_start:              # answer text is ready, audio follows -> glow
    - script.execute: led_responding   # amp is switched by the media player itself (on_announcement)
  on_end:
    - script.execute: amp_off_later    # safety net: amp off if nothing is playing
    - script.execute: respond_guard    # TTS failed to play -> don't glow for 120 s
    - if:                    # no answer audio (e.g. nothing understood) -> back to idle now
        condition:
          lambda: 'return id(led_phase) == 1 || id(led_phase) == 2;'
        then:
          - script.execute: led_idle
    - delay: 100ms
    - micro_wake_word.start:
  on_error:
    - script.execute: amp_off_later
    - logger.log:
        format: "Voice assistant error %s: %s"
        args: [ 'code.c_str()', 'message.c_str()' ]
    - script.execute: led_error
    - delay: 100ms
    - micro_wake_word.start:

# ---------------------------------------------------------------------------
# USB-C power budget: read the CC voltage the charger sets on the 5.1 kOhm pull-downs.
#   ~0.25 V = default USB (<= 0.9 A)   ~0.66 V = 1.5 A   ~1.23 V = 3 A   (only one CC is driven, take the max)
# The LED ring brightness is capped accordingly (led_max), everything else stays unchanged.
# ---------------------------------------------------------------------------
sensor:
  - platform: adc
    id: cc1_v
    pin: GPIO4
    attenuation: 12db
    update_interval: 10s
    internal: true
  - platform: adc
    id: cc2_v
    pin: GPIO5
    attenuation: 12db
    update_interval: 10s
    internal: true
    on_value:
      then:
        - lambda: |-
            float v = std::max(id(cc1_v).state, id(cc2_v).state);
            float cap = (v > 1.0f) ? 1.0f : (v > 0.45f ? 0.5f : 0.25f);   // 3 A / 1.5 A / default USB
            if (cap != id(led_max)) {
              id(led_max) = cap;
              ESP_LOGI("power", "USB-C CC %.2f V -> LED cap %.0f %%", v, cap * 100);
            }
            id(usb_limit).publish_state(v > 1.0f ? 3.0f : (v > 0.45f ? 1.5f : 0.9f));
  - platform: template
    id: usb_limit
    name: "${friendly_name} USB-C current limit"
    unit_of_measurement: "A"
    accuracy_decimals: 1
    update_interval: never

# ---------------------------------------------------------------------------
# LED ring: 18x WS2812B on the board edge, GPIO14 -> 74AHCT1G125 -> 330 Ohm -> D2 ... D19 (clockwise, start back-left)
# ---------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: ring
    name: "${friendly_name} Ring"
    pin: GPIO14
    num_leds: 18
    chipset: ws2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 300ms
    # 18 x 60 mA = 1.08 A at full white; 60 % cap -> ~0.65 A. Budget at 5 V/3 A: LEDs 0.65 + amp ~0.8 + ESP32 ~0.4 A.
    color_correct: [60%, 60%, 60%]
    effects:
      # Listening: slow, calm breathing
      - pulse:
          name: "Breathe"
          transition_length: 1.4s
          update_interval: 1.4s
          min_brightness: 20%
          max_brightness: 100%
      # Thinking: a comet with a fading tail runs around the board edge (~1 turn per 1.3 s)
      - addressable_lambda:
          name: "Thinking"
          update_interval: 16ms
          lambda: |-
            static float head = 0.0f;
            const int n = it.size();
            const float speed = n / (1.3f / 0.016f);   // LEDs per frame
            const float tail = n * 0.35f;              // tail length in LEDs
            if (initial_run) head = 0.0f;
            head = fmodf(head + speed, (float) n);
            for (int i = 0; i < n; i++) {
              float d = head - i;
              if (d < 0) d += n;                        // distance behind the head
              float k = (d < tail) ? 1.0f - d / tail : 0.0f;
              k = k * k;                                // smooth quadratic fade
              uint8_t r = current_color.r * k;
              uint8_t g = current_color.g * k;
              uint8_t b = current_color.b * k;
              if (d < 1.0f) {                           // head: a touch brighter/whiter
                r = 255; g = std::min(255, g + 60); b = std::min(255, b + 25);
              }
              it[i] = Color(r, g, b);
            }
      # Responding: steady glow with a very slow, subtle shimmer so it feels alive
      - addressable_lambda:
          name: "Speaking"
          update_interval: 30ms
          lambda: |-
            static float t = 0.0f;
            t += 0.03f;
            const int n = it.size();
            for (int i = 0; i < n; i++) {
              float phase = t * 1.6f + i * (6.2832f / n) * 2.0f;
              float k = 0.85f + 0.15f * sinf(phase);  // 70..100 % brightness ripple
              it[i] = Color(current_color.r * k, current_color.g * k, current_color.b * k);
            }

# ---------------------------------------------------------------------------
# State machine: 0 idle | 1 listening | 2 thinking | 3 responding | 4 error | 5 disconnected
# Every stage arms the watchdog; if the next event never arrives, the LEDs return to idle.
# ---------------------------------------------------------------------------
globals:
  - id: led_phase
    type: int
    initial_value: '0'
  - id: led_max                          # brightness cap from the USB-C power budget (1.0 / 0.5 / 0.25)
    type: float
    initial_value: '1.0'

script:
  - id: led_listening
    mode: restart
    then:
      - lambda: 'id(led_phase) = 1;'
      - light.turn_on:
          id: ring
          red: ${amber_r}
          green: ${amber_g}
          blue: ${amber_b}
          brightness: !lambda 'return id(led_max);'
          effect: "Breathe"
      - script.execute:
          id: led_watchdog
          timeout_s: ${listen_timeout_s}
      - script.execute: pipeline_watchdog

  - id: led_thinking
    mode: restart
    then:
      - lambda: 'id(led_phase) = 2;'
      - light.turn_on:
          id: ring
          red: ${amber_r}
          green: ${amber_g}
          blue: ${amber_b}
          brightness: !lambda 'return id(led_max);'
          effect: "Thinking"
      - script.execute:
          id: led_watchdog
          timeout_s: ${think_timeout_s}

  - id: led_responding
    mode: restart
    then:
      - lambda: 'id(led_phase) = 3;'
      - light.turn_on:
          id: ring
          red: ${amber_r}
          green: ${amber_g}
          blue: ${amber_b}
          brightness: !lambda 'return 0.8f * id(led_max);'
          effect: "Speaking"
      - script.execute:
          id: led_watchdog
          timeout_s: ${respond_timeout_s}

  - id: led_idle
    mode: restart
    then:
      - script.stop: led_watchdog
      - lambda: 'id(led_phase) = 0;'
      - light.turn_off:
          id: ring
          transition_length: 800ms

  - id: led_error
    mode: restart
    then:
      - script.stop: led_watchdog
      - lambda: 'id(led_phase) = 4;'
      - repeat:
          count: 2
          then:
            - light.turn_on:
                id: ring
                red: 100%
                green: 4%
                blue: 0%
                brightness: !lambda 'return 0.7f * id(led_max);'
                effect: "None"
            - delay: 180ms
            - light.turn_off:
                id: ring
                transition_length: 0s
            - delay: 180ms
      - script.execute: led_idle

  - id: led_disconnected    # dim red breathing until Home Assistant reconnects
    mode: restart
    then:
      - script.stop: led_watchdog
      - lambda: 'id(led_phase) = 5;'
      - light.turn_on:
          id: ring
          red: 100%
          green: 3%
          blue: 0%
          brightness: 25%
          effect: "Breathe"

  # Per-stage timeout: re-armed by every stage (restart mode), fires only if a stage hangs.
  - id: led_watchdog
    mode: restart
    parameters:
      timeout_s: int
    then:
      - delay: !lambda 'return timeout_s * 1000;'
      - logger.log:
          format: "LED stage %d timed out -> idle"
          args: [ 'id(led_phase)' ]
          level: WARN
      - script.execute: led_idle

  # Hard limit for the whole interaction: stops a pipeline that never ends.
  - id: pipeline_watchdog
    mode: restart
    then:
      - delay: ${pipeline_timeout_s}s
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - logger.log:
                format: "Voice pipeline exceeded ${pipeline_timeout_s}s -> stopping"
                level: WARN
            - voice_assistant.stop:
            - script.execute: led_idle
            - delay: 200ms
            - micro_wake_word.start:

  # After the pipeline ends: if we are still 'responding' but nothing is playing, go idle.
  - id: respond_guard
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            and:
              - lambda: 'return id(led_phase) == 3;'
              - media_player.is_idle: mp
          then:
            - logger.log:
                format: "Responding but no audio -> idle"
                level: WARN
            - script.execute: led_idle

  # Amp off shortly after playback ends (only if nothing started playing again)
  - id: amp_off_later
    mode: restart
    then:
      - delay: 400ms
      - if:
          condition:
            media_player.is_idle: mp
          then:
            - switch.turn_off: amp_enable
