# Copy to secrets.yaml (next to the device YAML, or in the ESPHome dashboard's Secrets editor) and fill in.
# Never commit the real secrets.yaml.
wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"
# 32 random bytes, base64. Generate one per device, e.g.:  python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
# or with the key button in the ESPHome dashboard editor. The same key goes into Home Assistant when adopting the device.
api_encryption_key: "REPLACE_WITH_32_BYTE_BASE64_KEY"
ota_password: "choose-a-long-random-string"
